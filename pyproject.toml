[project]
name = "neurotree"
version = "0.1.0"
description = "A 3D attention tree of everything on this Mac"
requires-python = ">=3.12"
dependencies = ["networkx>=3.3", "numpy>=1.26"]

[project.optional-dependencies]
semantic = ["model2vec>=0.4"]  # the meaning head; without it questions use the word head only
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
